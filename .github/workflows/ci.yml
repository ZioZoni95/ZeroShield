name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Settimanale: nuove CVE nelle dipendenze anche senza commit.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt, vet, staticcheck, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Ultima patch 1.26.x: la stdlib di go.mod (1.26.2) ha CVE note che
          # govulncheck segnala; il toolchain in go.mod la allinea anche in locale.
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal pkg bpf zt-gui/*.go)"
          if [ -n "$out" ]; then echo "File non formattati:"; echo "$out"; exit 1; fi
      - name: go vet (senza stub eBPF)
        # cmd/zt-shield richiede gli stub bpf2go: lo copre il job ebpf.
        run: go vet ./cmd/zt-tui ./cmd/zt-mockd ./pkg/... ./internal/...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./cmd/zt-tui ./cmd/zt-mockd ./pkg/... ./internal/...
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Ultima patch 1.26.x: la stdlib di go.mod (1.26.2) ha CVE note che
          # govulncheck segnala; il toolchain in go.mod la allinea anche in locale.
          go-version: "1.26.x"
          check-latest: true
      - name: go test -race
        # Nessun test richiede root o kernel: quelli stanno in docs/TESTING.md.
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./cmd/zt-tui ./cmd/zt-mockd ./internal/... ./pkg/...
      - name: Riepilogo coverage
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fuzz smoke (config)
        run: |
          for f in $(go test -list '^Fuzz' ./internal/config | grep ^Fuzz); do
            go test -run '^$' -fuzz "^$f\$" -fuzztime 20s ./internal/config
          done
      - name: Script VPN (comandi finti, senza rete)
        run: |
          bash scripts/test_nm_vpn.sh
          bash scripts/test_proton.sh
      - name: Kill-switch (network namespace usa e getta, root)
        # Gira in un namespace: non tocca la rete del runner.
        run: |
          sudo apt-get install -y -q nftables iproute2
          sudo bash scripts/test_killswitch.sh
      - name: Canary fanotify reale (root)
        # Test con fanotify vero: avvio, tocco esca, massa, kill in enforce.
        # GOCACHE separata: root non deve sporcare la cache dell'utente runner.
        run: sudo -E env "PATH=$PATH" GOCACHE=/tmp/gocache-root go test -count=1 -run Root -v ./internal/canary
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  ebpf:
    name: eBPF (clang + bpf2go + demone)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Ultima patch 1.26.x: la stdlib di go.mod (1.26.2) ha CVE note che
          # govulncheck segnala; il toolchain in go.mod la allinea anche in locale.
          go-version: "1.26.x"
          check-latest: true
      - name: Toolchain eBPF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang llvm libbpf-dev linux-tools-generic
          echo "BPFTOOL=$(ls /usr/lib/linux-tools/*/bpftool | head -1)" >> "$GITHUB_ENV"
      - name: vmlinux.h + bpf2go
        # CO-RE: il BTF del runner basta per compilare, le rilocazioni si
        # risolvono sul kernel di destinazione al load.
        run: make generate BPFTOOL="$BPFTOOL"
      - name: go vet completo (demone incluso)
        run: go vet ./...
      - name: Build demone + TUI + mock
        run: |
          go build -trimpath -o bin/zt-shield ./cmd/zt-shield
          go build -trimpath -o bin/zt-tui ./cmd/zt-tui
          go build -trimpath -o bin/zt-mockd ./cmd/zt-mockd
          go build -trimpath -o bin/zt-probe ./cmd/zt-probe
      - name: Kernel reale (zt-probe)
        # Verifier per programma sul kernel del runner + XDP su loopback.
        # Fallisce su un rifiuto del verifier o se XDP non droppa; un tipo di
        # programma non supportato dal kernel (LSM) e' solo segnalato.
        # L'esito per programma va nel riepilogo della run e come annotazioni,
        # cosi' si vede subito se il verifier ha accettato gli hook LSM.
        run: |
          sudo ./bin/zt-probe -xdp-lo | tee probe.txt
          { echo '### zt-probe (kernel del runner)'; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(✅|⚠️|❌)' probe.txt | while IFS= read -r l; do echo "::notice title=zt-probe::$l"; done
      - name: Pacchetto .deb (zeroshield)
        run: |
          make package BPFTOOL="$BPFTOOL"
          dpkg-deb -I dist/zeroshield_*.deb
          dpkg-deb -c dist/zeroshield_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: zt-shield-linux-amd64
          path: |
            bin/
            dist/

  gui:
    name: GUI (Vite + Wails Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zt-gui/frontend/package-lock.json
      - name: Frontend
        working-directory: zt-gui/frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Test GUI nel browser (Chrome di sistema, demone simulato)
        # Il driver si installa senza salvarlo: package.json non cambia.
        working-directory: zt-gui/frontend
        run: |
          npm i --no-save playwright-core
          node tests/gui.test.mjs dist
      - name: Librerie GTK/WebKit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: go vet + build (webkit2_41)
        working-directory: zt-gui
        run: |
          go vet -tags webkit2_41 .
          go build -tags webkit2_41 -o /dev/null .
      - name: Pacchetto .deb (zeroshield-gui)
        run: make package-gui
      - uses: actions/upload-artifact@v4
        with:
          name: zeroshield-gui-deb
          path: dist/
      - name: govulncheck (GUI)
        working-directory: zt-gui
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags webkit2_41 .

  security:
    name: Sicurezza (govulncheck, gosec)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Ultima patch 1.26.x: la stdlib di go.mod (1.26.2) ha CVE note che
          # govulncheck segnala; il toolchain in go.mod la allinea anche in locale.
          go-version: "1.26.x"
          check-latest: true
      - name: govulncheck (modulo principale)
        # Bloccante: una CVE raggiungibile nelle dipendenze ferma la pipeline.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/zt-tui ./cmd/zt-mockd ./pkg/... ./internal/...
      - name: gosec (SARIF)
        # Non bloccante: ha falsi positivi noti (G115 sui layout kernel, G302 sul
        # socket 0666 voluto). I risultati vanno in Security > Code scanning.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -no-fail -exclude-generated -fmt sarif -out gosec.sarif ./cmd/zt-tui ./cmd/zt-mockd ./pkg/... ./internal/...
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif
          category: gosec
