# Release: a ogni tag vX.Y.Z compila i due .deb e li allega a una GitHub Release.
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deb:
    name: Pacchetti .deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zt-gui/frontend/package-lock.json
      - name: Toolchain eBPF + GTK/WebKit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang llvm libbpf-dev linux-tools-generic libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "BPFTOOL=$(ls /usr/lib/linux-tools/*/bpftool | head -1)" >> "$GITHUB_ENV"
      - name: Build + test prima del pacchetto
        run: |
          make generate BPFTOOL="$BPFTOOL"
          go vet ./...
          go test -race ./internal/... ./pkg/...
      - name: Pacchetti
        # VERSION dal tag: v0.1.0 -> 0.1.0 (lo calcola il Makefile).
        run: |
          make package BPFTOOL="$BPFTOOL"
          make package-gui
          cd dist && sha256sum ./*.deb > SHA256SUMS && cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Pre-release finche' gli hook LSM non sono collaudati in enforce (TEST_SANDBOX.md).
        run: |
          cat > /tmp/notes.md <<'EOF'
          # ⚠️ ALPHA — SOLO LAB, NON USO REALE ⚠️

          > **Gli hook LSM non sono mai stati agganciati su un kernel con BPF attivo:
          > il blocco effettivo dei segreti NON è verificato. XDP e canary sì
          > (vedi `docs/TEST_SANDBOX.md`). Installare questo .deb su una macchina
          > vera non protegge nulla e può negarti i tuoi stessi file in enforce.**

          Scarica ENTRAMBI i .deb e installali insieme: il pacchetto GUI da solo non si installa.

          ```
          sudo apt install ./zeroshield_*_amd64.deb ./zeroshield-gui_*_amd64.deb
          ```

          Uso consentito: VM usa-e-getta con snapshot, dati finti, profilo audit.
          Prima accensione reale solo dopo riga enforce verde in TEST_SANDBOX.md.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "ZeroShield $GITHUB_REF_NAME" --prerelease \
            --notes-file /tmp/notes.md
