# Release: a ogni tag vX.Y.Z compila il .deb UNICO e lo allega a una GitHub Release.
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deb:
    name: Pacchetto .deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zt-gui/frontend/package-lock.json
      - name: Toolchain eBPF + GTK/WebKit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang llvm libbpf-dev linux-tools-generic libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "BPFTOOL=$(ls /usr/lib/linux-tools/*/bpftool | head -1)" >> "$GITHUB_ENV"
      - name: Build + test prima del pacchetto
        run: |
          make generate BPFTOOL="$BPFTOOL"
          go vet ./...
          go test -race ./internal/... ./pkg/...
      - name: Pacchetto
        # VERSION dal tag: v0.1.0 -> 0.1.0 (lo calcola il Makefile).
        run: |
          make package BPFTOOL="$BPFTOOL"
          cd dist && sha256sum ./*.deb > SHA256SUMS && cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Pre-release finche' gli hook LSM non sono collaudati in enforce (TEST_SANDBOX.md).
        run: |
          # Novita' = la sezione del CHANGELOG per la versione del tag (nessun testo da aggiornare a mano).
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > /tmp/changes.md
          if ! grep -q '[^[:space:]]' /tmp/changes.md; then
            echo "Nessuna voce $VER nel CHANGELOG: vedi il file CHANGELOG.md del repository." > /tmp/changes.md
          fi
          {
            cat <<'HEAD'
          # ⚠️ ALPHA — SOLO LAB, NON USO REALE ⚠️

          > **Il blocco dei segreti è stato visto funzionare una sola volta, su un solo PC
          > (kernel 7.0 Ubuntu) e con un file finto: apertura, rinomina, cancellazione,
          > troncamento e hard link negati; XDP, canary e radar collaudati (vedi
          > `docs/COLLAUDO_LSM_2026-11-05.md`). NON è stato collaudato in una VM isolata
          > né con i programmi veri sulle protezioni predefinite (ssh, kubectl, git...).
          > In enforce può negarti i tuoi stessi file: usalo in audit e metti in Blocca
          > una protezione alla volta.**

          HEAD
            echo "## Novità della $VER"
            echo
            cat /tmp/changes.md
            echo
            echo "Cronologia completa: [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
            cat <<'TAIL'

          ## Installazione

          Un solo pacchetto: `zeroshield_*_amd64.deb` contiene demone, TUI, GUI desktop e icona nella barra.
          Le librerie grafiche (GTK/WebKit) sono *consigliate*: apt le installa da solo sul
          desktop; su un server usa `apt install --no-install-recommends` e la GUI non parte.
          Sostituisce il vecchio `zeroshield-gui` (fino a v0.0.3).

          ```
          sha256sum -c SHA256SUMS --ignore-missing
          sudo apt install ./zeroshield_*_amd64.deb
          ```

          Aggiornando: chiudi la GUI prima e riaprila dopo; riavvia l'icona con
          `systemctl --user restart zeroshield-tray`. Ogni release è un'istantanea del codice al
          suo tag, non cumulativa.

          Uso consentito: VM usa-e-getta con snapshot, dati finti, profilo audit.
          Prima accensione reale solo dopo riga enforce verde in TEST_SANDBOX.md.
          TAIL
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "ZeroShield $GITHUB_REF_NAME" --prerelease \
            --notes-file /tmp/notes.md
