# Pacchetto UNICO: demone, TUI, GUI, probe, script, servizio, documentazione.
# Le librerie grafiche (GTK/WebKit) sono Recommends: sul desktop apt le installa da solo,
# su un server si usa `apt install --no-install-recommends` e la GUI semplicemente non parte.
# Build: make package   (VERSION e ARCH dall'ambiente, vedi Makefile)
name: zeroshield
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: admin
priority: optional
maintainer: ZioZoni95 <noreply@github.com>
description: |
  Scudo zero-trust locale nel kernel Linux (eBPF XDP + LSM), con TUI e GUI desktop.
  Protegge i segreti (chiavi SSH, kubeconfig, token) da processi non autorizzati,
  scarta LLMNR/mDNS/NBT-NS in ingresso, esche anti-ransomware via fanotify.
  Progetto sperimentale: leggere /usr/share/doc/zeroshield/TEST_SANDBOX.md.
vendor: ZioZoni95
homepage: https://github.com/ZioZoni95/ZeroShield
license: MIT
depends:
  - systemd
recommends:
  - libgtk-3-0t64 | libgtk-3-0
  - libwebkit2gtk-4.1-0
  - ufw
  - nftables
  - wireguard-tools
  # GNOME mostra l'icona di ZeroShield solo con questa estensione.
  - gnome-shell-extension-appindicator
suggests:
  - fido2-tools
# Fino a v0.0.3 la GUI era un pacchetto a parte (`zeroshield-gui`): questo lo sostituisce.
replaces:
  - zeroshield-gui
conflicts:
  - zeroshield-gui
contents:
  - src: bin/zt-shield
    dst: /usr/sbin/zt-shield
    file_info: { mode: 0755 }
  - src: bin/zt-probe
    dst: /usr/sbin/zt-probe
    file_info: { mode: 0755 }
  - src: bin/zt-tui
    dst: /usr/bin/zt-tui
    file_info: { mode: 0755 }
  # Demone finto con dati sintetici: la guida della GUI lo indica per la demo.
  - src: bin/zt-mockd
    dst: /usr/bin/zt-mockd
    file_info: { mode: 0755 }
  # Icona nella barra di sistema + avvio automatico alla login (senza privilegi).
  - src: bin/zt-tray
    dst: /usr/bin/zt-tray
    file_info: { mode: 0755 }
  - src: packaging/zeroshield-tray.desktop
    dst: /etc/xdg/autostart/zeroshield-tray.desktop
    file_info: { mode: 0644 }
  # GUI desktop (Wails + WebKitGTK).
  - src: bin/zt-gui
    dst: /usr/bin/zt-gui
    file_info: { mode: 0755 }
  - src: packaging/zeroshield.desktop
    dst: /usr/share/applications/zeroshield.desktop
  - src: zt-gui/build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/zeroshield.png
  - src: packaging/zt-shield.service
    dst: /usr/lib/systemd/system/zt-shield.service
  # Config: mai sovrascritta agli aggiornamenti (regole scritte a mano).
  - src: configs/shield.example.yaml
    dst: /etc/zt-shield/shield.yaml
    type: config|noreplace
    file_info: { mode: 0644 }
  - src: scripts/harden_system.sh
    dst: /usr/share/zeroshield/scripts/harden_system.sh
    file_info: { mode: 0755 }
  - src: scripts/setup_fido2.sh
    dst: /usr/share/zeroshield/scripts/setup_fido2.sh
    file_info: { mode: 0755 }
  - src: scripts/check_prereqs.sh
    dst: /usr/share/zeroshield/scripts/check_prereqs.sh
    file_info: { mode: 0755 }
  # Imposta utente e profilo nel config e avvia il servizio del pacchetto (usato anche dalla GUI).
  - src: scripts/configure_service.sh
    dst: /usr/share/zeroshield/scripts/configure_service.sh
    file_info: { mode: 0755 }
  # VPN: kill-switch nftables, auto-VPN per NetworkManager, helper Proton.
  # Nessuno parte da solo (vedi docs/VPN_SETUP.md): li lanci tu, in VM la prima volta.
  - src: scripts/vpn_killswitch.sh
    dst: /usr/share/zeroshield/scripts/vpn_killswitch.sh
    file_info: { mode: 0755 }
  - src: scripts/nm_vpn.sh
    dst: /usr/share/zeroshield/scripts/nm_vpn.sh
    file_info: { mode: 0755 }
  - src: scripts/proton_setup.sh
    dst: /usr/share/zeroshield/scripts/proton_setup.sh
    file_info: { mode: 0755 }
  - src: scripts/proton_current.sh
    dst: /usr/share/zeroshield/scripts/proton_current.sh
    file_info: { mode: 0755 }
  - src: scripts/proton_up.sh
    dst: /usr/share/zeroshield/scripts/proton_up.sh
    file_info: { mode: 0755 }
  # Polkit: chi può comandare il demone via canale di controllo (auth admin).
  - src: packaging/org.zeroshield.manage.policy
    dst: /usr/share/polkit-1/actions/org.zeroshield.manage.policy
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/zeroshield/README.md
  - src: LICENSE
    dst: /usr/share/doc/zeroshield/copyright
  - src: docs/TEST_SANDBOX.md
    dst: /usr/share/doc/zeroshield/TEST_SANDBOX.md
  - src: docs/TESTING_LAB.md
    dst: /usr/share/doc/zeroshield/TESTING_LAB.md
  - src: docs/CANARY.md
    dst: /usr/share/doc/zeroshield/CANARY.md
  - src: docs/VPN_SETUP.md
    dst: /usr/share/doc/zeroshield/VPN_SETUP.md
scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh
